; Maiskolben THT firmware 4.x
; Build:  pio run
; Flash:  pio run -t upload
; Most cheap Nano clones still use the old bootloader (57600 baud).
; If the upload times out, use the "nano_new" environment instead.

[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags =
	-Wall
	-Wextra
	; Panel quirks, only needed if the image looks wrong:
	; -DTFT_MADCTL=0x60      ; rotated by 180 degrees
	; -DTFT_OFFSET_X=1       ; image shifted horizontally
	; -DTFT_OFFSET_Y=2       ; image shifted vertically
	; -DTFT_INVERT=1         ; colors inverted

[env:nano]
board = nanoatmega328

[env:nano_new]
board = nanoatmega328new
