# Builds the firmware on every push and pull request.
# On main: publishes the browser flasher (with the current build) to GitHub Pages.
# On a v* tag: creates a GitHub release with the .hex file attached.
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e nano

      - name: Collect artifacts
        id: meta
        run: |
          version=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' src/config.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          hex="maiskolben-tht-$version.hex"
          cp .pio/build/nano/firmware.hex "dist/$hex"
          size=$(python3 -c "import sys; print(sum(int(l[1:3], 16) for l in open(sys.argv[1]) if l[7:9] == '00'))" "dist/$hex")
          cat > dist/manifest.json <<EOF
          {
            "version": "$version",
            "commit": "${GITHUB_SHA::7}",
            "date": "$(date -u +%Y-%m-%d)",
            "hex": "$hex",
            "size": ${size:-0}
          }
          EOF
          cat dist/manifest.json

      - name: Flasher self-test
        run: node web/test/flash.test.mjs dist/maiskolben-tht-*.hex

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  site:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web/public/firmware

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Release was created in the GitHub UI: just attach the build.
            gh release upload "$tag" dist/*.hex --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/*.hex \
              --repo "$GITHUB_REPOSITORY" \
              --title "Maiskolben THT $tag" \
              --notes "Firmware ${{ needs.build.outputs.version }} for the Maiskolben THT (board rev. 1.3c). Flash it with PlatformIO or directly from the browser flasher."
          fi
